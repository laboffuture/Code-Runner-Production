<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coderunner — Node Graph</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }

/* ── Canvas ── */
#canvas { position: fixed; inset: 0; cursor: grab; }
#canvas.grabbing { cursor: grabbing; }

/* ── Dot Grid ── */
#grid-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ── SVG connections ── */
#svg-layer { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; z-index: 1; }

/* ── World (panned/zoomed container) ── */
#world { position: absolute; top: 0; left: 0; transform-origin: 0 0; z-index: 2; }

/* ── Nodes ── */
.node {
  position: absolute;
  width: 200px;
  background: #1e2235;
  border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,.1);
  box-shadow: 0 4px 24px rgba(0,0,0,.5), 0 0 0 0 transparent;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .15s;
  z-index: 10;
}
.node:hover { border-color: rgba(255,255,255,.35); box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 20px rgba(255,255,255,.05); transform: translateY(-2px); }
.node.active { border-color: var(--nc); box-shadow: 0 0 0 2px var(--nc), 0 8px 32px rgba(0,0,0,.6); }

.node-header {
  background: var(--nc);
  border-radius: 8px 8px 0 0;
  padding: 9px 12px;
  display: flex; align-items: center; gap: 8px;
}
.node-icon { font-size: 16px; line-height: 1; }
.node-title { font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .3px; }
.node-subtitle { font-size: 10px; color: rgba(255,255,255,.7); margin-top: 1px; }

.node-body { padding: 10px 12px; }
.node-desc { font-size: 11px; color: #94a3b8; line-height: 1.5; margin-bottom: 6px; }
.node-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ntag {
  font-size: 10px; font-weight: 600; padding: 1px 7px;
  border-radius: 4px; border: 1px solid; opacity: .9;
}

/* ── Ports ── */
.port {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #1e2235;
  border: 2px solid var(--nc);
  cursor: crosshair;
  transition: transform .15s, background .15s;
  z-index: 20;
}
.port:hover { transform: scale(1.5); background: var(--nc); }
.port.out { right: -6px; }
.port.in  { left: -6px; }
.port.top { top: 50%; transform: translateY(-50%); }
.port.bot { bottom: 50%; transform: translateY(50%); }

/* ── Connection paths ── */
.conn-path {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  opacity: .75;
}
.conn-arrow { opacity: .75; }
.conn-label {
  font-size: 10px;
  fill: rgba(255,255,255,.45);
  font-family: 'Segoe UI', system-ui, sans-serif;
  pointer-events: none;
}

/* ── Flow animation ── */
.flow-dot {
  r: 4;
  opacity: 0;
}

/* ── HUD ── */
#hud {
  position: fixed; bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 100;
}
.hud-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: #1e2235; border: 1px solid rgba(255,255,255,.15);
  color: #94a3b8; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.hud-btn:hover { background: #2a3050; color: #f1f5f9; }

#zoom-label {
  position: fixed; bottom: 20px; left: 20px;
  background: #1e2235; border: 1px solid rgba(255,255,255,.1);
  color: #64748b; font-size: 11px; font-family: monospace;
  padding: 6px 10px; border-radius: 6px; z-index: 100;
}

/* ── Title ── */
#title-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px;
  background: rgba(10,12,26,.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 200;
}
#title-bar h1 { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -.3px; }
.tb-tag { font-size: 10px; color: #64748b; font-family: monospace; background: rgba(255,255,255,.05); border-radius: 4px; padding: 2px 8px; }

/* ── Legend ── */
#legend {
  position: fixed; top: 58px; left: 16px;
  background: rgba(10,12,26,.85); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
  padding: 12px 14px; z-index: 100; min-width: 160px;
}
.leg-title { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #475569; text-transform: uppercase; margin-bottom: 8px; }
.leg-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-text { font-size: 11px; color: #94a3b8; }

/* ── Tooltip ── */
#tooltip {
  position: fixed; pointer-events: none; z-index: 300;
  background: #0f1629; border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px; padding: 10px 14px; max-width: 240px;
  opacity: 0; transition: opacity .15s; box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
#tooltip.show { opacity: 1; }
#tooltip h3 { font-size: 12px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
#tooltip p  { font-size: 11px; color: #64748b; line-height: 1.5; }
#tooltip .tip-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 3px; }
</style>
</head>
<body>

<div id="grid-bg"></div>

<div id="title-bar">
  <h1>⚡ CODERUNNER</h1>
  <span class="tb-tag">Architecture Graph</span>
  <span class="tb-tag">Scroll to zoom · Drag to pan</span>
</div>

<div id="legend">
  <div class="leg-title">Node Types</div>
  <div class="leg-item"><div class="leg-dot" style="background:#6366f1"></div><span class="leg-text">Frontend</span></div>
  <div class="leg-item"><div class="leg-dot" style="background:#10b981"></div><span class="leg-text">API / Gateway</span></div>
  <div class="leg-item"><div class="leg-dot" style="background:#f59e0b"></div><span class="leg-text">Worker / Runner</span></div>
  <div class="leg-item"><div class="leg-dot" style="background:#ef4444"></div><span class="leg-text">Execution / Sandbox</span></div>
  <div class="leg-item"><div class="leg-dot" style="background:#06b6d4"></div><span class="leg-text">Data Store</span></div>
  <div class="leg-item"><div class="leg-dot" style="background:#a855f7"></div><span class="leg-text">Infrastructure</span></div>
  <div class="leg-item"><div class="leg-dot" style="background:#ec4899"></div><span class="leg-text">CDN / External</span></div>
</div>

<div id="canvas">
  <svg id="svg-layer" width="4000" height="3000"><defs>
    <marker id="arr-indigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#818cf8" opacity=".8"/></marker>
    <marker id="arr-green"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#34d399" opacity=".8"/></marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#fbbf24" opacity=".8"/></marker>
    <marker id="arr-red"    markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f87171" opacity=".8"/></marker>
    <marker id="arr-cyan"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22d3ee" opacity=".8"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c084fc" opacity=".8"/></marker>
    <marker id="arr-pink"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f472b6" opacity=".8"/></marker>
  </defs></svg>
  <div id="world"></div>
</div>

<div id="hud">
  <button class="hud-btn" id="btn-fit" title="Fit to view">⊞</button>
  <button class="hud-btn" id="btn-plus" title="Zoom in">+</button>
  <button class="hud-btn" id="btn-minus" title="Zoom out">−</button>
</div>
<div id="zoom-label">100%</div>

<div id="tooltip"><h3 id="tt-title"></h3><p id="tt-desc"></p><div id="tt-tags" class="tip-tags"></div></div>

<script>
// ═══════════════════════════════════════════════════════════
// NODE DEFINITIONS
// ═══════════════════════════════════════════════════════════
const NODES = [
  {
    id: 'browser', x: 60, y: 320, color: '#6366f1',
    icon: '🌐', title: 'Browser', subtitle: 'Client',
    desc: 'React 18 SPA running in the user\'s browser.',
    tags: [['React 18','#818cf8'], ['TypeScript','#818cf8'], ['Monaco Editor','#818cf8']],
    detail: 'Renders all UI using React 18 + Next.js App Router. Monaco Editor for code input. Three.js WebGL backgrounds.',
    ports: { out: [{ id:'o1', y:.5 }], in: [] }
  },
  {

    tags: [['Next.js 14','#818cf8'], [':3000','#94a3b8']],

  {

    detail: 'Listens on port 80/443. Round-robin load balancing to API servers on 4000 and 4001.',
    ports: { out: [{ id:'o1', y:.35 },{ id:'o2', y:.65 }], in: [{ id:'i1', y:.5 }] }
  },

    id: 'api1', x: 860, y: 140, color: '#10b981',
    icon: '⚙', title: 'API Server 1', subtitle: 'Port 4000',
    desc: 'Express.js REST API — instance 1.',
    tags: [['Express','#34d399'], [':4000','#94a3b8'], ['PM2','#34d399']],
    detail: 'Handles auth, problems, levels, execution endpoints. JWT middleware. Rate limiting.',
    ports: { out: [{ id:'o1', y:.3 },{ id:'o2', y:.7 }], in: [{ id:'i1', y:.5 }] }
  },
  {
    id: 'api2', x: 860, y: 360, color: '#10b981',
    icon: '⚙', title: 'API Server 2', subtitle: 'Port 4001',
    desc: 'Express.js REST API — instance 2.',
    tags: [['Express','#34d399'], [':4001','#94a3b8'], ['PM2','#34d399']],
    detail: 'Identical to api-1. Both share MongoDB and Redis. Rate limiter is in-memory (⚠ bug).',
    ports: { out: [{ id:'o1', y:.3 },{ id:'o2', y:.7 }], in: [{ id:'i1', y:.5 }] }
  },
  {
    id: 'auth', x: 860, y: 560, color: '#10b981',
    icon: '🔐', title: 'Auth Middleware', subtitle: 'JWT Verify',
    desc: 'Validates JWT on every protected route.',
    tags: [['JWT','#34d399'], ['bcrypt','#34d399']],

  {

    tags: [['apiLimiter','#c084fc'], ['executionLimiter','#c084fc']],
    detail: 'Three rate limiters: apiLimiter, executionLimiter, dailyExecutionLimiter. Currently in-memory so limits are not shared between api-1 and api-2.',

  },
  {
    id: 'redis', x: 1140, y: 250, color: '#06b6d4',
    icon: '🔴', title: 'Redis', subtitle: 'Port 6379',
    desc: 'Message broker for BullMQ job queues + cache.',
    tags: [['ioredis','#22d3ee'], [':6379','#94a3b8'], ['BullMQ','#22d3ee']],
    detail: 'Stores BullMQ job queues: code-execution and code-submission. Also used for caching. Shared between all API and Runner instances.',

  },

    detail: 'container-pool.ts manages a pool of running Python containers. Avoids cold-start penalty. Containers recycled after 30 min.',

  },
  {
    id: 'sandbox', x: 1920, y: 250, color: '#ef4444',
    icon: '🐍', title: 'Python Sandbox', subtitle: 'Docker container',
    desc: 'Isolated Python 3.11 execution environment.',
    tags: [['python:3.11','#f87171'], ['no network','#94a3b8'], ['5s timeout','#94a3b8']],
    detail: 'python-code-runner image based on python:3.11-slim. Includes matplotlib (Agg), pygame (SDL2). Runs as non-root sandbox user.',

  },
  {
    id: 'mongodb', x: 1140, y: 620, color: '#06b6d4',
    icon: '🍃', title: 'MongoDB Atlas', subtitle: 'Cloud Database',
    desc: '6 collections: users, problems, progress, execution results, test cases, cheatsheets.',
    tags: [['Mongoose 8','#22d3ee'], ['Atlas','#22d3ee'], ['Cloud','#94a3b8']],
    detail: 'Users, UserProgress, Problem, TestCase, ExecutionResult, CheatSheet. Mongoose 8.18 ORM. Hosted on Atlas.',

  },
  {
    id: 'cloudinary', x: 340, y: 560, color: '#ec4899',
    icon: '🖼', title: 'Cloudinary CDN', subtitle: 'dwqzqxeuk',
    desc: '100 flowchart images + audio files. f_auto,q_auto.',

  },
  {

    icon: '🔄', title: 'PM2', subtitle: 'Process Manager',

    tags: [['4 processes','#c084fc'], ['auto-restart','#c084fc']],
    detail: 'ecosystem.config.js defines all 4 processes. Fork mode. Memory limits: 300M for API, 500M for Runners.',

  },
  {
    id: 'bullmq', x: 1140, y: 100, color: '#f59e0b',
    icon: '📋', title: 'BullMQ Queue', subtitle: 'code-execution',
    desc: 'Job queues sitting on Redis. code-execution + code-submission.',

    detail: 'Jobs created by API servers when code is submitted. Workers poll and process jobs. Job results stored in ExecutionResult collection.',

  },

// ═══════════════════════════════════════════════════════════
// CONNECTION DEFINITIONS
// from, fromPort, to, toPort, color, label, dashed
// ═══════════════════════════════════════════════════════════
const CONNS = [
  // Client flow
  { from:'browser',  fp:'o1', to:'nextjs',   tp:'i1', color:'#818cf8', marker:'indigo', label:'HTTP/WS' },
  { from:'nextjs',   fp:'o1', to:'nginx',    tp:'i1', color:'#34d399', marker:'green',  label:'REST API calls' },
  { from:'cloudinary',fp:'o1',to:'nextjs',   tp:'i1', color:'#f472b6', marker:'pink',   label:'CDN assets', dashed:true },

  // Nginx → API
  { from:'nginx',    fp:'o1', to:'api1',     tp:'i1', color:'#34d399', marker:'green',  label:':4000' },
  { from:'nginx',    fp:'o2', to:'api2',     tp:'i1', color:'#34d399', marker:'green',  label:':4001' },

  // API → Middleware
  { from:'api1',     fp:'o2', to:'auth',     tp:'i1', color:'#34d399', marker:'green',  label:'verify JWT', dashed:true },
  { from:'api2',     fp:'o2', to:'auth',     tp:'i1', color:'#34d399', marker:'green',  label:'', dashed:true },

  // API → BullMQ
  { from:'api1',     fp:'o1', to:'bullmq',   tp:'i1', color:'#fbbf24', marker:'orange', label:'enqueue job' },
  { from:'api2',     fp:'o1', to:'bullmq',   tp:'i2', color:'#fbbf24', marker:'orange', label:'' },

  // BullMQ ↔ Redis
  { from:'bullmq',   fp:'o1', to:'redis',    tp:'i1', color:'#22d3ee', marker:'cyan',   label:'persisted on', dashed:true },
  { from:'redis',    fp:'o1', to:'bullmq',   tp:null, color:'#22d3ee', marker:'cyan',   label:'', dashed:true, direct:true, ex:1140, ey:100, sx:1140, sy:250 },

  // Redis → Runners (via BullMQ)
  { from:'bullmq',   fp:'o1', to:'runner1',  tp:'i1', color:'#fbbf24', marker:'orange', label:'dequeue job' },
  { from:'bullmq',   fp:'o2', to:'runner2',  tp:'i1', color:'#fbbf24', marker:'orange', label:'' },

  // Runners → Container Pool
  { from:'runner1',  fp:'o1', to:'pool',     tp:'i1', color:'#f87171', marker:'red',    label:'get container' },
  { from:'runner2',  fp:'o1', to:'pool',     tp:'i2', color:'#f87171', marker:'red',    label:'' },

  // Pool → Sandbox
  { from:'pool',     fp:'o1', to:'sandbox',  tp:'i1', color:'#f87171', marker:'red',    label:'execute code' },

  // Sandbox → MongoDB
  { from:'sandbox',  fp:'o1', to:'mongodb',  tp:'i1', color:'#22d3ee', marker:'cyan',   label:'save result' },

  // API → MongoDB
  { from:'api1',     fp:'o2', to:'mongodb',  tp:'i2', color:'#22d3ee', marker:'cyan',   label:'read/write', dashed:true },
  { from:'api2',     fp:'o2', to:'mongodb',  tp:'i2', color:'#22d3ee', marker:'cyan',   label:'', dashed:true },

  // Rate Limiter
  { from:'nginx',    fp:'o2', to:'ratelimit',tp:'i1', color:'#c084fc', marker:'purple', label:'rate limit', dashed:true },
  { from:'ratelimit',fp:'o1', to:'api2',    tp:'i1', color:'#c084fc', marker:'purple',  label:'', dashed:true },
];

// ═══════════════════════════════════════════════════════════
// NODE HEIGHT MAP
// ═══════════════════════════════════════════════════════════
const NODE_W = 200;
function nodeH(n) {
  return 42 + 10 + (n.desc ? 14*2 : 0) + 10 + (n.tags.length > 0 ? 22 : 0) + 8;
}

// ═══════════════════════════════════════════════════════════
// RENDER NODES
// ═══════════════════════════════════════════════════════════
const world = document.getElementById('world');
const svgLayer = document.getElementById('svg-layer');
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('tt-title');
const ttDesc  = document.getElementById('tt-desc');
const ttTags  = document.getElementById('tt-tags');

const nodeEls = {};
const nodeData = {};
NODES.forEach(n => {
  nodeData[n.id] = n;
  const h = nodeH(n);

  const el = document.createElement('div');
  el.className = 'node';
  el.id = 'node-' + n.id;
  el.style.cssText = `left:${n.x}px;top:${n.y}px;--nc:${n.color};`;

  const tagHtml = n.tags.map(([t,c]) =>
    `<span class="ntag" style="color:${c};border-color:${c}33;background:${c}11">${t}</span>`
  ).join('');

  el.innerHTML = `
    <div class="node-header">
      <span class="node-icon">${n.icon}</span>
      <div>
        <div class="node-title">${n.title}</div>
        ${n.subtitle ? `<div class="node-subtitle">${n.subtitle}</div>` : ''}
      </div>
    </div>
    <div class="node-body">
      <div class="node-desc">${n.desc}</div>
      <div class="node-tags">${tagHtml}</div>
    </div>
  `;

  // Output ports
  (n.ports.out || []).forEach((p, i) => {
    const port = document.createElement('div');
    port.className = 'port out';
    port.id = `port-${n.id}-${p.id}`;
    port.style.top = `${p.y * 100}%`;
    port.style.transform = 'translateY(-50%)';
    el.appendChild(port);
  });

  // Input ports
  (n.ports.in || []).forEach((p, i) => {
    const port = document.createElement('div');
    port.className = 'port in';
    port.id = `port-${n.id}-${p.id}`;
    port.style.top = `${p.y * 100}%`;
    port.style.transform = 'translateY(-50%)';
    el.appendChild(port);
  });

  // Tooltip events
  el.addEventListener('mouseenter', e => showTooltip(n, e));
  el.addEventListener('mousemove',  e => moveTooltip(e));
  el.addEventListener('mouseleave', hideTooltip);

  world.appendChild(el);
  nodeEls[n.id] = el;
});

// ═══════════════════════════════════════════════════════════
// RENDER CONNECTIONS
// ═══════════════════════════════════════════════════════════
function getPortPos(nodeId, portId) {
  const n = nodeData[nodeId];
  const el = nodeEls[nodeId];
  const h = el.offsetHeight || 100;
  const allPorts = [...(n.ports.out || []), ...(n.ports.in || [])];
  if (!portId) return { x: n.x + NODE_W / 2, y: n.y + h / 2 };
  const portDef = allPorts.find(p => p.id === portId);
  if (!portDef) return { x: n.x + NODE_W, y: n.y + h / 2 };
  const isOut = (n.ports.out || []).some(p => p.id === portId);
  return {
    x: n.x + (isOut ? NODE_W + 0 : 0),
    y: n.y + portDef.y * h
  };
}

function makePath(sx, sy, ex, ey, curvature = 0.5) {
  const dx = Math.abs(ex - sx) * curvature;
  return `M${sx},${sy} C${sx+dx},${sy} ${ex-dx},${ey} ${ex},${ey}`;
}

// Give nodes time to render then draw connections
setTimeout(() => {
  CONNS.forEach((c, i) => {
    const from = nodeData[c.from];
    const to   = nodeData[c.to];
    if (!from || !to) return;

    let sp, ep;
    if (c.direct) {
      sp = { x: c.sx, y: c.sy };
      ep = { x: c.ex, y: c.ey };
    } else {
      const fromEl = nodeEls[c.from];
      const toEl   = nodeEls[c.to];
      const fh = fromEl.offsetHeight || 100;
      const th = toEl.offsetHeight   || 100;

      const fromPorts = from.ports.out || [];
      const toPorts   = to.ports.in   || [];
      const fp = fromPorts.find(p => p.id === c.fp) || fromPorts[0];
      const tp = toPorts.find(p => p.id === c.tp)   || toPorts[0];

      sp = {
        x: from.x + NODE_W,
        y: from.y + (fp ? fp.y * fh : fh * 0.5)
      };
      ep = {
        x: to.x,
        y: to.y + (tp ? tp.y * th : th * 0.5)
      };
    }

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');

    // Main path
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const d = makePath(sp.x, sp.y, ep.x, ep.y);
    path.setAttribute('d', d);
    path.setAttribute('stroke', c.color);
    path.setAttribute('class', 'conn-path');
    if (c.dashed) path.setAttribute('stroke-dasharray', '5 4');
    path.setAttribute('marker-end', `url(#arr-${c.marker})`);
    g.appendChild(path);

    // Label
    if (c.label) {
      const mx = (sp.x + ep.x) / 2;
      const my = (sp.y + ep.y) / 2 - 8;
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', mx);
      label.setAttribute('y', my);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('class', 'conn-label');
      label.textContent = c.label;
      g.appendChild(label);
    }

    // Animated flow dot
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('r', '4');
    dot.setAttribute('fill', c.color);
    dot.classList.add('flow-dot');
    const anim = document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
    anim.setAttribute('dur', `${1.5 + Math.random() * 2}s`);
    anim.setAttribute('repeatCount','indefinite');
    anim.setAttribute('begin', `${Math.random() * 3}s`);
    const mpPath = document.createElementNS('http://www.w3.org/2000/svg','mpath');
    mpPath.setAttributeNS('http://www.w3.org/1999/xlink','href','#conn-path-'+i);
    path.setAttribute('id','conn-path-'+i);
    anim.appendChild(mpPath);
    dot.appendChild(anim);
    const animOp = document.createElementNS('http://www.w3.org/2000/svg','animate');
    animOp.setAttribute('attributeName','opacity');
    animOp.setAttribute('values','0;1;1;0');
    animOp.setAttribute('keyTimes','0;0.1;0.85;1');
    animOp.setAttribute('dur', `${1.5 + Math.random() * 2}s`);
    animOp.setAttribute('repeatCount','indefinite');
    animOp.setAttribute('begin', `${Math.random() * 3}s`);
    dot.appendChild(animOp);
    g.appendChild(dot);

    svgLayer.appendChild(g);
  });
}, 80);

// ═══════════════════════════════════════════════════════════
// PAN + ZOOM
// ═══════════════════════════════════════════════════════════
let tx = 0, ty = 60, scale = 0.75;
let dragging = false, lastX = 0, lastY = 0;
const canvas = document.getElementById('canvas');
const zoomLabel = document.getElementById('zoom-label');

function applyTransform() {
  world.style.transform   = `translate(${tx}px,${ty}px) scale(${scale})`;
  svgLayer.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  zoomLabel.textContent   = Math.round(scale * 100) + '%';
}
applyTransform();

canvas.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx += e.clientX - lastX;
  ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('grabbing'); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tx = mx - (mx - tx) * factor;
  ty = my - (my - ty) * factor;
  scale = Math.max(0.2, Math.min(2.5, scale * factor));
  applyTransform();
}, { passive: false });

// Touch support
let lastTouchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    tx += e.touches[0].clientX - lastX; ty += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    applyTransform();
  }
  if (e.touches.length === 2 && lastTouchDist) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const factor = d / lastTouchDist; lastTouchDist = d;
    scale = Math.max(0.2, Math.min(2.5, scale * factor));
    applyTransform();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; lastTouchDist = null; });

// Buttons
document.getElementById('btn-plus').onclick  = () => { scale = Math.min(2.5, scale * 1.15); applyTransform(); };
document.getElementById('btn-minus').onclick = () => { scale = Math.max(0.2, scale * 0.87); applyTransform(); };
document.getElementById('btn-fit').onclick   = fitView;

function fitView() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const minX = Math.min(...NODES.map(n => n.x));
  const minY = Math.min(...NODES.map(n => n.y));
  const maxX = Math.max(...NODES.map(n => n.x + NODE_W));
  const maxY = Math.max(...NODES.map(n => n.y + 120));
  const contentW = maxX - minX + 80;
  const contentH = maxY - minY + 80;
  scale = Math.min(0.95, Math.min(vw / contentW, (vh - 60) / contentH));
  tx = (vw - contentW * scale) / 2 - minX * scale + 40 * scale;
  ty = 60 + (vh - 60 - contentH * scale) / 2 - minY * scale + 40 * scale;
  applyTransform();
}
setTimeout(fitView, 200);

// ═══════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════
function showTooltip(n, e) {
  ttTitle.textContent = n.title + (n.subtitle ? ` · ${n.subtitle}` : '');
  ttDesc.textContent  = n.detail || n.desc;
  ttTags.innerHTML = n.tags.map(([t,c]) =>
    `<span class="ntag" style="color:${c};border-color:${c}33;background:${c}11">${t}</span>`
  ).join('');
  ttTitle.style.color = n.color;
  tooltip.classList.add('show');
  moveTooltip(e);
}
function moveTooltip(e) {
  const x = e.clientX + 16, y = e.clientY + 16;
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  tooltip.style.left = (x + w > window.innerWidth  ? x - w - 32 : x) + 'px';
  tooltip.style.top  = (y + h > window.innerHeight ? y - h - 32 : y) + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

// ═══════════════════════════════════════════════════════════
// NODE DRAG
// ═══════════════════════════════════════════════════════════
let dragNode = null, dragOffX = 0, dragOffY = 0;
Object.entries(nodeEls).forEach(([id, el]) => {
  el.addEventListener('mousedown', e => {
    if (e.target.classList.contains('port')) return;
    e.stopPropagation();
    dragNode = id;
    dragOffX = e.clientX / scale - nodeData[id].x;
    dragOffY = e.clientY / scale - nodeData[id].y;
    el.style.zIndex = 50;
  });
});
window.addEventListener('mousemove', e => {
  if (!dragNode) return;
  const n = nodeData[dragNode];
  n.x = e.clientX / scale - dragOffX - tx / scale;
  n.y = e.clientY / scale - dragOffY - ty / scale;
  nodeEls[dragNode].style.left = n.x + 'px';
  nodeEls[dragNode].style.top  = n.y + 'px';
  rebuildConnections();
});
window.addEventListener('mouseup', () => {
  if (dragNode) { nodeEls[dragNode].style.zIndex = 10; dragNode = null; }
});

function rebuildConnections() {
  while (svgLayer.children.length > 1) svgLayer.removeChild(svgLayer.lastChild);
  CONNS.forEach((c, i) => {
    const from = nodeData[c.from];
    const to   = nodeData[c.to];
    if (!from || !to) return;
    const fromEl = nodeEls[c.from];
    const toEl   = nodeEls[c.to];
    const fh = fromEl.offsetHeight || 100;
    const th = toEl.offsetHeight   || 100;
    const fromPorts = from.ports.out || [];
    const toPorts   = to.ports.in   || [];
    const fp = fromPorts.find(p => p.id === c.fp) || fromPorts[0];
    const tp = toPorts.find(p => p.id === c.tp)   || toPorts[0];
    const sp = { x: from.x + NODE_W, y: from.y + (fp ? fp.y * fh : fh * 0.5) };
    const ep = { x: to.x, y: to.y + (tp ? tp.y * th : th * 0.5) };
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', makePath(sp.x, sp.y, ep.x, ep.y));
    path.setAttribute('stroke', c.color);
    path.setAttribute('class', 'conn-path');
    if (c.dashed) path.setAttribute('stroke-dasharray', '5 4');
    path.setAttribute('marker-end', `url(#arr-${c.marker})`);
    path.setAttribute('id','conn-path-'+i);
    g.appendChild(path);
    if (c.label) {
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', (sp.x+ep.x)/2); t.setAttribute('y', (sp.y+ep.y)/2-8);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','conn-label');
      t.textContent = c.label; g.appendChild(t);
    }
    svgLayer.appendChild(g);
  });
}
</script>
</body>
